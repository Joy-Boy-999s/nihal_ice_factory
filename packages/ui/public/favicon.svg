<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <g id="arm" stroke-linecap="round">
      <line x1="32" y1="30" x2="32" y2="13"/>
      <line x1="32" y1="17.5" x2="27" y2="13"/>
      <line x1="32" y1="17.5" x2="37" y2="13"/>
      <line x1="32" y1="24" x2="27.8" y2="20"/>
      <line x1="32" y1="24" x2="36.2" y2="20"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="32" rx="14" fill="url(#shine)"/>
  <g stroke="#ffffff" stroke-width="3" fill="none">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60 32 32)"/>
    <use href="#arm" transform="rotate(120 32 32)"/>
    <use href="#arm" transform="rotate(180 32 32)"/>
    <use href="#arm" transform="rotate(240 32 32)"/>
    <use href="#arm" transform="rotate(300 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="3.4" fill="#ffffff"/>
</svg>
