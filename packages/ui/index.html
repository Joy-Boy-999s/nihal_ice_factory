<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nihal Ice Factory — ERP</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" sizes="any" />

    <!-- Anti-FOUC: apply saved theme before first paint -->
    <script>
      (function(){try{var t=localStorage.getItem('nif-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);return;}if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();
    </script>

    <!-- Inter — modern geometric typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root">
      <!-- Boot loader: shown while the JS bundle downloads; React replaces it on mount -->
      <style>
        #nif-boot {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 1.1rem;
          background:
            radial-gradient(440px 340px at 16% 10%, rgba(79,70,229,0.18), transparent 62%),
            radial-gradient(400px 320px at 86% 90%, rgba(34,211,238,0.12), transparent 62%),
            #eef1f8;
          font-family: 'Inter', system-ui, sans-serif;
        }
        html[data-theme='dark'] #nif-boot {
          background:
            radial-gradient(440px 340px at 16% 10%, rgba(99,102,241,0.22), transparent 62%),
            radial-gradient(400px 320px at 86% 90%, rgba(34,211,238,0.10), transparent 62%),
            #0d1117;
        }
        #nif-boot .stage { position: relative; width: 112px; height: 112px; display: grid; place-items: center; }
        #nif-boot .ring-outer {
          position: absolute; inset: 0; border-radius: 50%;
          border: 1.5px dashed rgba(99,102,241,0.45);
          animation: nif-boot-spin 10s linear infinite;
        }
        #nif-boot .ring-inner {
          position: absolute; inset: 9px; border-radius: 50%;
          border: 2.5px solid transparent;
          border-top-color: #6366f1;
          border-right-color: rgba(34,211,238,0.7);
          animation: nif-boot-spin 1.1s cubic-bezier(0.55,0.15,0.45,0.85) infinite reverse;
        }
        #nif-boot .glow {
          position: absolute; inset: 10px; border-radius: 50%;
          background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, rgba(34,211,238,0.14) 45%, transparent 72%);
          filter: blur(2px);
          animation: nif-boot-glow 2.4s ease-in-out infinite;
        }
        #nif-boot svg {
          position: relative; width: 56%; height: 56%;
          filter: drop-shadow(0 0 10px rgba(99,102,241,0.35)) drop-shadow(0 0 18px rgba(34,211,238,0.28));
          animation: nif-boot-flake 7s linear infinite;
        }
        #nif-boot p {
          margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: 0.02em;
          color: #5a6a80;
          animation: nif-boot-fade 1.6s ease-in-out infinite;
        }
        html[data-theme='dark'] #nif-boot p { color: #8292a8; }
        @keyframes nif-boot-spin  { to { transform: rotate(360deg); } }
        @keyframes nif-boot-glow  { 0%,100% { transform: scale(0.85); opacity: 0.55; } 50% { transform: scale(1.12); opacity: 1; } }
        @keyframes nif-boot-flake { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes nif-boot-fade  { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
          #nif-boot .ring-outer, #nif-boot .glow, #nif-boot svg, #nif-boot p { animation: none; }
        }
      </style>
      <div id="nif-boot" role="status" aria-label="Loading Nihal Ice Factory">
        <div class="stage">
          <span class="glow"></span>
          <span class="ring-outer"></span>
          <span class="ring-inner"></span>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="nif-boot-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#818cf8"/>
                <stop offset="55%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#22d3ee"/>
              </linearGradient>
              <g id="nif-boot-arm" stroke-linecap="round">
                <line x1="32" y1="29" x2="32" y2="8"/>
                <line x1="32" y1="13" x2="26.5" y2="8.5"/>
                <line x1="32" y1="13" x2="37.5" y2="8.5"/>
                <line x1="32" y1="20" x2="27" y2="15.5"/>
                <line x1="32" y1="20" x2="37" y2="15.5"/>
              </g>
            </defs>
            <g stroke="url(#nif-boot-grad)" stroke-width="2.4" fill="none">
              <use href="#nif-boot-arm"/>
              <use href="#nif-boot-arm" transform="rotate(60 32 32)"/>
              <use href="#nif-boot-arm" transform="rotate(120 32 32)"/>
              <use href="#nif-boot-arm" transform="rotate(180 32 32)"/>
              <use href="#nif-boot-arm" transform="rotate(240 32 32)"/>
              <use href="#nif-boot-arm" transform="rotate(300 32 32)"/>
            </g>
            <circle cx="32" cy="32" r="3" fill="url(#nif-boot-grad)"/>
          </svg>
        </div>
        <p>Loading Nihal Ice Factory…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
